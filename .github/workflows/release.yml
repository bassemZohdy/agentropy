name: release

# TASK-043.1: tag-driven release (docs/release.md, owner decisions of 2026-11-08). Pushing a tag vX.Y.Z
#   1. verifies the repository (tag = package versions, audit, pnpm check, check-pack),
#   2. publishes the libraries with npm trusted publishing (GitHub OIDC) and provenance under the `next` dist-tag,
#   3. publishes the host image to GHCR tagged by version and addressed by digest, signed with cosign (keyless) with
#      the SBOM and build provenance attached as attestations,
#   4. creates the GitHub release from CHANGELOG.md with the SBOMs attached.
# Nothing here runs until the owner has created the npm organization and the trusted publishers (docs/release.md,
# TASK-043.3). There is no long-lived npm token; check-deploy holds these rules.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Every library version equals the tag
        run: |
          for p in core runtime store-sqlite store-postgres workflow-conductor testkit; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            test "v$v" = "$GITHUB_REF_NAME" || { echo "packages/$p is $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vulnerability audit of production dependencies
        run: pnpm audit --prod
      - name: Lint, type check, tests, format and API index
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Package check (metadata, tarballs, install into a fresh project)
        run: node scripts/check-pack.mjs
      - name: Package SBOMs
        run: node scripts/sbom.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-packages
          path: sbom/

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish the libraries (trusted publishing, provenance, dist-tag next)
        run: pnpm -r publish --provenance --tag next --access public --no-git-checks

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/agentropy-host" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push (tagged by version, never latest)
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build -f deploy/Dockerfile -t "${IMAGE}:${VERSION}" .
          docker push "${IMAGE}:${VERSION}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Image SBOM (CycloneDX) with syft
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" anchore/syft:v1.57.0@sha256:3c70e6d5979364cefdc22b51617a78fd264574d3bd6b4f84a351204147025e2a "${IMAGE}:${VERSION}" -o cyclonedx-json=/out/host-image.cdx.json
          test -s sbom/host-image.cdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image digest and attach the SBOM
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom/host-image.cdx.json "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: sbom/host-image.cdx.json

  release:
    needs: [publish, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sbom
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [${version}]" 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then awk '/^## \[Unreleased\]/ { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md; fi
          test -s notes.md
      - name: Create the GitHub release (a pre-release while the version is 0.x)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease sbom/*.cdx.json
