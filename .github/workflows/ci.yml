name: scaffold-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vulnerability audit of production dependencies (TASK-030.1)
        run: pnpm audit --prod
      - name: TypeScript build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests (offline) with V8 coverage summary
        run: pnpm exec vitest run --coverage
      - name: Examples (J1 price watch, J2 expense approval)
        run: |
          node packages/examples/dist/price-watch.js
          node packages/examples/dist/expense-approval.js
          node packages/examples/dist/quickstart.js
      - name: DCO script unit tests
        run: node --test scripts/check-dco.test.mjs
      - name: Verify documentation link targets
        run: node scripts/check-doc-links.mjs
      - name: Backlog lint (todo-skills invariants I1-I10)
        run: bash .todo/todo-lint.sh TODO.md CHANGELOG.md
      - name: Readiness traceability (acceptance matrix, crosswalk, contract revisions)
        run: node scripts/check-readiness.mjs
      - name: Formatting
        run: pnpm format:check
      - name: Deployment files (offline checks)
        run: node scripts/check-deploy.mjs
      - name: API reference up to date
        run: node scripts/api-index.mjs --check
      - name: Release packaging (pack, inspect, install tarballs, run a task)
        run: node scripts/check-pack.mjs
      - name: SBOMs (CycloneDX) for the packages and the host application (TASK-030.2)
        run: node scripts/sbom.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-packages
          path: sbom/

  node-floor:
    # TASK-033.5: the engines floor (Node 24.0.0) builds and passes the offline suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.0.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  postgres:
    # FEAT-031: Store conformance, contention cases and benchmarks on a PostgreSQL server.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agentropy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AGENTROPY_PG_URL: postgres://postgres:ci@127.0.0.1:5432/agentropy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Store conformance on PostgreSQL server
        run: pnpm exec vitest run packages/store-postgres/test/postgres-server.test.ts
      - name: Benchmarks including PostgreSQL server ([bench] lines)
        run: pnpm exec vitest run packages/testkit/test/benchmarks.test.ts

  image:
    # FEAT-028.8: build the host image and smoke-test it the way Kubernetes/OpenShift run it.
    runs-on: ubuntu-latest
    services:
      # FEAT-041.4: the PostgreSQL mode of the image runs against a real server (two replicas, one database).
      postgres:
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agentropy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -f deploy/Dockerfile -t agentropy-host:ci .
      - name: Image SBOM (CycloneDX, OS and application packages) with syft (TASK-030.2)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out"             anchore/syft:v1.57.0@sha256:3c70e6d5979364cefdc22b51617a78fd264574d3bd6b4f84a351204147025e2a             agentropy-host:ci -o cyclonedx-json=/out/host-image.cdx.json
          test -s sbom/host-image.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-image
          path: sbom/host-image.cdx.json
      - name: Run as the image user (read-only root, no capabilities)
        run: |
          docker run -d --name host --read-only --tmpfs /tmp -v agentropy-data:/data \
            -e AGENTROPY_A2A_TOKENS=ci-token=ci-peer -e AGENTROPY_ALLOW=delegation:delegate,task:dispatch,capability:notification:use \
            --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 agentropy-host:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          curl -fsS localhost:8080/healthz
          bash deploy/a2a-smoke.sh localhost:8080 ci-token
          test "$(docker exec host id -u)" != "0"
          docker stop -t 30 host
          docker logs host
          test "$(docker inspect -f '{{.State.ExitCode}}' host)" = "0"
      - name: Run with an arbitrary UID in group 0 (OpenShift restricted-v2)
        run: |
          docker run -d --name host-oc --user 1000770000:0 --read-only --tmpfs /tmp \
            -v agentropy-data-oc:/data --cap-drop ALL --security-opt no-new-privileges -p 8081:8080 agentropy-host:ci
          for i in $(seq 1 30); do curl -fsS localhost:8081/readyz && break; sleep 1; done
          curl -fsS localhost:8081/readyz
          docker stop -t 30 host-oc
          docker logs host-oc
      - name: Run two replicas on PostgreSQL (shared database, relay lease, A2A across them)
        run: |
          for n in 1 2; do
            docker run -d --name host-pg-$n --network host --read-only --tmpfs /tmp               --cap-drop ALL --security-opt no-new-privileges               -e PORT=809$n -e HOSTNAME=pod-$n               -e AGENTROPY_PG_URL=postgres://postgres:ci@127.0.0.1:5432/agentropy               -e AGENTROPY_A2A_TOKENS=ci-token=ci-peer -e AGENTROPY_ALLOW=delegation:delegate,task:dispatch,capability:notification:use               agentropy-host:ci
          done
          for p in 8091 8092; do
            for i in $(seq 1 60); do curl -fsS localhost:$p/readyz && break; sleep 1; done
            curl -fsS localhost:$p/readyz
          done
          bash deploy/a2a-smoke.sh localhost:8091 ci-token
          bash deploy/a2a-smoke.sh localhost:8092 ci-token
          for n in 1 2; do docker stop -t 30 host-pg-$n; docker logs host-pg-$n; done
          for n in 1 2; do test "$(docker inspect -f '{{.State.ExitCode}}' host-pg-$n)" = "0"; done

  conductor:
    # FEAT-035.2: the Conductor adapter against a real Conductor OSS server (opt-in live suite).
    runs-on: ubuntu-latest
    services:
      conductor:
        image: conductoross/conductor-standalone:3.15.0@sha256:099e36a7840616a979559fa0b2aebbcfada2c7b4b8c4c99cdc4679e8a26a7592
        ports: ['8080:8080']
    env:
      AGENTROPY_CONDUCTOR_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Wait for Conductor
        run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health
      - name: Conductor adapter on a live server
        run: pnpm exec vitest run packages/workflow-conductor/test/conductor-live.test.ts

