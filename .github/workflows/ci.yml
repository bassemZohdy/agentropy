name: scaffold-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests (offline)
        run: pnpm test
      - name: Examples (J1 price watch, J2 expense approval)
        run: |
          node packages/examples/dist/price-watch.js
          node packages/examples/dist/expense-approval.js
      - name: DCO script unit tests
        run: node --test scripts/check-dco.test.mjs
      - name: Verify documentation link targets
        run: node scripts/check-doc-links.mjs
      - name: Backlog lint (todo-skills invariants I1-I10)
        run: bash .todo/todo-lint.sh TODO.md CHANGELOG.md
      - name: Readiness traceability (acceptance matrix, crosswalk, contract revisions)
        run: node scripts/check-readiness.mjs
      - name: Formatting
        run: pnpm format:check
