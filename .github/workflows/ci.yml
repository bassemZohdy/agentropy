name: scaffold-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Smoke tests (no network calls)
        run: pnpm test
      - name: DCO script unit tests
        run: node --test scripts/check-dco.test.mjs
      - name: Formatting
        run: pnpm format:check
