# TASK-030.1 (R-15): weekly update proposals for npm packages, GitHub Actions (SHA pins) and the base image (digest pin).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # TASK-048: typescript-eslint does not support TypeScript 7 (eslint crashes) and TypeScript 7 no longer includes
      # Node types by default, so a major bump breaks lint and typecheck. Revisit when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
