# Single-writer runtime on SQLite with a persistent volume (FEAT-028.8). One replica: SQLite is single-node by
# design (ADR-0017); scale out with the PostgreSQL adapter instead (docs/deployment.md). Works unchanged on
# OpenShift (restricted-v2): no fixed UID, no privilege escalation, read-only root filesystem.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentropy
  labels:
    app.kubernetes.io/name: agentropy
spec:
  replicas: 1
  serviceName: agentropy
  selector:
    matchLabels:
      app.kubernetes.io/name: agentropy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentropy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: registry.example.com/agentropy/agentropy-host:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: AGENTROPY_DB
              value: /data/agentropy.db
            - name: AGENTROPY_ALLOW
              valueFrom:
                configMapKeyRef:
                  name: agentropy-policy
                  key: allow
            # A2A endpoint (FEAT-034.1): off unless the Secret `agentropy-a2a` (key `tokens`, `token=principalId`
            # entries) exists. Peers are users the echo instance is shared with.
            - name: AGENTROPY_A2A_TOKENS
              valueFrom:
                secretKeyRef:
                  name: agentropy-a2a
                  key: tokens
                  optional: true
            - name: AGENTROPY_TENANT
              valueFrom:
                configMapKeyRef:
                  name: agentropy-policy
                  key: tenant
                  optional: true
            - name: AGENTROPY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: agentropy-policy
                  key: publicUrl
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # A start that migrates the schema or opens a large store may take a while: the liveness probe only starts once
          # this one has passed (up to 30 x 5 s = 150 s), so a slow start is not a failing one.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
