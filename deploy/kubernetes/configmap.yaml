# Sample policy allow-list for the example host (deny by default). Production deployments replace the sample
# policy with their own policy decision point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentropy-policy
  labels:
    app.kubernetes.io/name: agentropy
data:
  # The A2A echo agent also needs capability:notification:use. Optional keys: tenant (AGENTROPY_TENANT) and
  # publicUrl (AGENTROPY_PUBLIC_URL, the URL the AgentCard advertises).
  allow: "agent:create,agent:share,delegation:delegate,task:dispatch,capability:notification:use"
