archgram: 1
title: How a delegated task runs
description: >-
  A caller delegates a task. The task service checks policy and writes the
  task, its audit intent and an outbox event in one store transaction. The
  runtime asks the policy again before it dispatches, runs the agent handler,
  and the outbox relay carries the outcome to the user's inbox.
direction: auto
