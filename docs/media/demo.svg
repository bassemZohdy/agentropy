<rect width="960" height="470" rx="10" fill="#0d1117"/>
<rect width="960" height="40" rx="10" fill="#161b22"/><rect y="30" width="960" height="10" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="68" cy="20" r="6" fill="#27c93f"/>
<text x="480" y="26" text-anchor="middle" style="font-size:14px;fill:#8b949e;opacity:1">agentropy, examples</text>
<line x1="32" x2="928" y1="422" y2="422" stroke="#21262d"/>
<text x="32" y="446" class="cap" style="animation:k0 29.95s linear infinite">A task waits on a timer, holding no worker, then completes with its result</text>
<g style="animation:k1 29.95s linear infinite"><text x="32" y="100" class="p">$ </text></g>
<text x="53.599999999999994" y="100" class="c" style="animation:k2 29.95s linear infinite">pnpm example:quickstart</text>
<text x="32" y="150" fill="#c9d1d9" style="animation:k3 29.95s linear infinite">{</text>
<text x="32" y="175" fill="#7ee787" style="animation:k4 29.95s linear infinite">  "status": "completed",</text>
<text x="32" y="200" fill="#c9d1d9" style="animation:k5 29.95s linear infinite">  "output": {</text>
<text x="32" y="225" fill="#c9d1d9" style="animation:k6 29.95s linear infinite">    "reminder": "stand-up in 5 minutes",</text>
<text x="32" y="250" fill="#c9d1d9" style="animation:k7 29.95s linear infinite">    "scheduledFor": "2026-11-25T02:42:03.779Z"</text>
<text x="32" y="275" fill="#c9d1d9" style="animation:k8 29.95s linear infinite">  }</text>
<text x="32" y="300" fill="#c9d1d9" style="animation:k9 29.95s linear infinite">}</text>
<text x="32" y="446" class="cap" style="animation:k10 29.95s linear infinite">A monitoring agent watches a price feed and reports back through the assistant</text>
<g style="animation:k11 29.95s linear infinite"><text x="32" y="100" class="p">$ </text></g>
<text x="53.599999999999994" y="100" class="c" style="animation:k12 29.95s linear infinite">pnpm example:price-watch</text>
<text x="32" y="150" fill="#ffa657" style="animation:k13 29.95s linear infinite">user&gt; Tell me when ACME drops below 100.</text>
<text x="32" y="175" fill="#79c0ff" style="animation:k14 29.95s linear infinite">assistant&gt; A monitoring agent is watching ACME for you.</text>
<text x="32" y="200" fill="#c9d1d9" style="animation:k15 29.95s linear infinite">feed&gt; ACME 120</text>
<text x="32" y="225" fill="#c9d1d9" style="animation:k16 29.95s linear infinite">feed&gt; ACME 105</text>
<text x="32" y="250" fill="#c9d1d9" style="animation:k17 29.95s linear infinite">feed&gt; ACME 99</text>
<text x="32" y="275" fill="#ffa657" style="animation:k18 29.95s linear infinite">user&gt; Anything new?</text>
<text x="32" y="300" fill="#79c0ff" style="animation:k19 29.95s linear infinite">assistant&gt; ACME is at 99 (below 100)</text>
<text x="32" y="325" fill="#7ee787" style="animation:k20 29.95s linear infinite">monitor task: completed</text>
<text x="32" y="446" class="cap" style="animation:k21 29.95s linear infinite">A task waits for a human approval in the manager’s inbox, then pays</text>
<g style="animation:k22 29.95s linear infinite"><text x="32" y="100" class="p">$ </text></g>
<text x="53.599999999999994" y="100" class="c" style="animation:k23 29.95s linear infinite">pnpm example:expense-approval</text>
<text x="32" y="150" fill="#ffa657" style="animation:k24 29.95s linear infinite">employee&gt; submit expense 4200 (team offsite)</text>
<text x="32" y="175" fill="#c9d1d9" style="animation:k25 29.95s linear infinite">task: waiting</text>
<text x="32" y="200" fill="#d2a8ff" style="animation:k26 29.95s linear infinite">manager inbox&gt; Approve expense of 4200? Risk: medium. Amount above the 1,000</text>
<text x="32" y="225" fill="#c9d1d9" style="animation:k27 29.95s linear infinite">  auto-approval limit.</text>
<text x="32" y="250" fill="#ffa657" style="animation:k28 29.95s linear infinite">manager&gt; approve</text>
<text x="32" y="275" fill="#7ee787" style="animation:k29 29.95s linear infinite">result&gt; paid pay-1; Risk: medium. Amount above the 1,000 auto-approval limit.</text>
<g class="final" style="opacity:0">
<text x="32" y="100" class="p">$ </text><text x="53.599999999999994" y="100" class="c">pnpm example:expense-approval</text>
<text x="32" y="150" fill="#ffa657">employee&gt; submit expense 4200 (team offsite)</text>
<text x="32" y="175" fill="#c9d1d9">task: waiting</text>
<text x="32" y="200" fill="#d2a8ff">manager inbox&gt; Approve expense of 4200? Risk: medium. Amount above the 1,000</text>
<text x="32" y="225" fill="#d2a8ff">  auto-approval limit.</text>
<text x="32" y="250" fill="#ffa657">manager&gt; approve</text>
<text x="32" y="275" fill="#7ee787">result&gt; paid pay-1; Risk: medium. Amount above the 1,000 auto-approval limit.</text>
<text x="32" y="446" class="cap">A task waits for a human approval in the manager’s inbox, then pays</text>
</g>
</svg>
