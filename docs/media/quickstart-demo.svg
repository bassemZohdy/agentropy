<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
<title id="t">Agentropy quickstart</title>
<desc id="d">A terminal runs pnpm example:quickstart and prints a completed task whose output holds the reminder "stand-up in 5 minutes".</desc>
<style>
.p{fill:#7ee787}.c{fill:#e6edf3}.o{fill:#c9d1d9}
text{font:18px Consolas,Menlo,'DejaVu Sans Mono',monospace;white-space:pre}
@keyframes ty{0%,10.22%{clip-path:inset(0 100% 0 0)}27.84%,100%{clip-path:inset(0 0 0 0)}}@keyframes l0{0%,36.78%{opacity:0}37.42%,100%{opacity:1}}@keyframes l1{0%,41.25%{opacity:0}41.89%,100%{opacity:1}}@keyframes l2{0%,45.72%{opacity:0}46.36%,100%{opacity:1}}@keyframes l3{0%,50.19%{opacity:0}50.83%,100%{opacity:1}}@keyframes l4{0%,54.66%{opacity:0}55.30%,100%{opacity:1}}@keyframes l5{0%,59.13%{opacity:0}59.77%,100%{opacity:1}}@keyframes l6{0%,63.60%{opacity:0}64.24%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){text{animation:none!important;opacity:1!important;clip-path:none!important}}
</style>
<rect width="960" height="440" rx="10" fill="#0d1117"/>
<rect width="960" height="40" rx="10" fill="#161b22"/><rect y="30" width="960" height="10" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="68" cy="20" r="6" fill="#27c93f"/>
<text x="480" y="26" text-anchor="middle" style="font-size:14px;fill:#8b949e">agentropy, quickstart</text>
<text x="32" y="96" class="p">$ </text><text x="53.6" y="96" class="c" style="animation:ty 7.83s steps(23) infinite">pnpm example:quickstart</text>
<text x="32" y="148" xml:space="preserve" class="o" style="animation:l0 7.83s linear infinite">{</text>
<text x="32" y="174" xml:space="preserve" class="o" style="animation:l1 7.83s linear infinite">  "status": "completed",</text>
<text x="32" y="200" xml:space="preserve" class="o" style="animation:l2 7.83s linear infinite">  "output": {</text>
<text x="32" y="226" xml:space="preserve" class="o" style="animation:l3 7.83s linear infinite">    "reminder": "stand-up in 5 minutes",</text>
<text x="32" y="252" xml:space="preserve" class="o" style="animation:l4 7.83s linear infinite">    "scheduledFor": "2026-11-25T02:32:05.601Z"</text>
<text x="32" y="278" xml:space="preserve" class="o" style="animation:l5 7.83s linear infinite">  }</text>
<text x="32" y="304" xml:space="preserve" class="o" style="animation:l6 7.83s linear infinite">}</text>
</svg>
